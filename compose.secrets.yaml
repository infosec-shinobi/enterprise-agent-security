# Development-only OpenBao lab. Dev root token must NEVER be reused outside this lab.
services:
  openbao:
    image: quay.io/openbao/openbao:2.2.2
    command: ["server", "-dev", "-dev-root-token-id=lab-root-token", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
